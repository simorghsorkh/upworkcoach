name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-check without code changes: new advisories (pnpm audit) and a
  # full-history secret scan (gitleaks scans all commits on schedule).
  schedule:
    - cron: "30 2 * * 6" # Saturday 06:00 Asia/Tehran
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment).
# Dependabot (github-actions ecosystem) updates both together.
jobs:
  check:
    name: lint, typecheck, test, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Disposable database for integration tests (instead of embedded-postgres).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: upworkcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d upworkcoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Throwaway CI-only credentials for the service container above (not a secret).
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/upworkcoach_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: dependency audit, no Server Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SEC-A10: Server Actions are forbidden (no "use server" in apps/ or packages/).
      - name: No "use server"
        run: bash scripts/ci-no-server-actions.sh

      # ADR-0013: no new hard-coded interface text or physical direction classes.
      - name: i18n guard
        run: node scripts/ci-i18n-guard.mjs

      # pnpm audit reads pnpm-lock.yaml only; no install needed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # SEC-D2: runtime deps, fail on high or critical. Exceptions (dated):
      # .github/audit-exceptions.txt. Fails closed if the registry errors.
      - name: Audit runtime dependencies (high+)
        run: node scripts/ci-audit.mjs --prod --level high

      # Dev/build tooling runs in CI and on laptops: fail on critical only.
      - name: Audit all dependencies (critical)
        run: node scripts/ci-audit.mjs --level critical

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists PR commits to scan only the PR range
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: needed for PR/push ranges and the scheduled full scan
          persist-credentials: false

      # SEC-K1. push/pull_request: scans the new commits; schedule/workflow_dispatch:
      # scans the whole history. Personal-account repo: no GITLEAKS_LICENSE needed
      # (an organization repo would need it as a secret).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .github/gitleaks.toml
          # No PR comments (would need write access) and no SARIF artifact
          # (a report of findings should not be downloadable from CI).
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
